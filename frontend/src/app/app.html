@if (cargando()) {
  <app-cargando />
} @else {
  <router-outlet></router-outlet>
}

@if (mostrarAvisoDeSesion()) {
  <app-modal
    titulo="Tu sesión está por expirar"
    mensaje="Te queda 1 minuto de sesión. ¿Querés extenderla?"
    tipo="info"
    [confirmacion]="true"
    txtCancelar="Cerrar"
    txtConfirmar="Extender sesión"
    (cerrar)="cerrarAvisoSesion()"
    (confirmar)="extenderSesion()"
  />
}
