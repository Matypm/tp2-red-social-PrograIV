<router-outlet></router-outlet>

@if (mostrarAvisoDeSesion()) {
    <app-modal
        titulo="Tu sesión está por expirar"
        mensaje="Te quedan 5 minutos de sesión. ¿Querés extenderla?"
        tipo="info"
        [confirmacion]="true"
        txtCancelar="Cerrar sesión"
        txtConfirmar="Extender sesión"
        (cerrar)="cerrarSesion()"
        (confirmar)="extenderSesion()"
    />
}
