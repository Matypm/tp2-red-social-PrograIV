
<div class="auth-page">
  <div class="auth-card register-card">

    <img class="auth-logo" src="nexocat.png" alt="Nexocat">

    <h2 class="auth-title">Crear cuenta</h2>

    <form class="auth-form" [formGroup]="registerForm" (ngSubmit)="onSubmit()">

      <div class="form-row">
        <div class="form-group">
          <label for="nombre">Nombre</label>
          <input type="text" id="nombre" formControlName="nombre">
        </div>

        <div class="form-group">
          <label for="apellido">Apellido</label>
          <input type="text" id="apellido" formControlName="apellido">
        </div>
      </div>

      <div class="form-group">
        <label for="correo">Correo electrónico</label>
        <input type="email" id="correo" formControlName="correo">
      </div>

      <div class="form-group">
        <label for="nombre_usuario">Nombre de usuario</label>
        <input type="text" id="nombre_usuario" formControlName="nombre_usuario">
      </div>

      <div class="form-group">
        <label for="contrasenia">Contraseña</label>
        <input type="password" id="contrasenia" formControlName="contrasenia">
        <small>Mínimo 8 caracteres, una mayúscula y un número.</small>
      </div>

      <div class="form-group">
        <label for="repetir_contrasenia">Repetir contraseña</label>
        <input type="password" id="repetir_contrasenia" formControlName="repetir_contrasenia">
      </div>

      <div class="form-group">
        <label>Fecha de nacimiento</label>

        <div class="form-row fecha-row">
          <input type="number" placeholder="Día" formControlName="dia">

          <select formControlName="mes">
            <option value="" disabled>Mes</option>
            @for (mes of meses; track mes.valor) {
              <option [value]="mes.valor">{{ mes.nombre }}</option>
            }
          </select>

          <input type="number" placeholder="Año" formControlName="anio">
        </div>
      </div>

      <div class="form-group">
        <label for="descripcion">Descripción</label>
        <textarea
          id="descripcion"
          formControlName="descripcion"
          placeholder="Contanos algo sobre vos..."
          maxlength="250">
        </textarea>
      </div>

      <div class="form-group">
        <label for="img_perfil">Imagen de perfil</label>
        <input type="file" id="img_perfil" accept="image/*">
      </div>

      <button
        class="auth-btn"
        type="submit">
        {{ cargando() ? 'Registrando...' : 'Crear cuenta' }}
      </button>

      <p class="auth-footer">
        ¿Ya tenés cuenta? <a routerLink="/login">Iniciá sesión</a>
      </p>

    </form>
  </div>
</div>

@if (modalVisible()) {
  <app-modal
    [titulo]="modalTitulo()"
    [mensaje]="modalMsj()"
    [tipo]="modalTipo()"
    (cerrar)="cerrarModal()">
  </app-modal>
}
