<header class="header">
  <a routerLink="/publicaciones" class="logo">
    <img src="/nexocat.png" alt="NexoCat">
  </a>

  <h1>PUBLICACIONES</h1>

  <a routerLink="/perfil" class="btn-perfil">
    Mi perfil
  </a>
</header>
<main class="contenedor-publicaciones">

  @if (cargando()) {
  <p class="mensaje-estado">Cargando publicaciones...</p>
  }

  @else if (error()) {
  <p class="mensaje-error">{{ error() }}</p>
  }

  @else if (publicaciones().length === 0) {
  <p class="mensaje-estado">Todavía no hay publicaciones.</p>
  }

  @else {
  <section class="lista-publicaciones">

    @for (publicacion of publicaciones(); track publicacion._id) {

    <app-publicacion-component 
      [publicacion]="publicacion"
      (publicacionActualizada)="actualizarPublicacion($event)"
    />

    }
  </section>
  }

</main>
